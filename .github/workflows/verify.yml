name: Verify portfolio

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile examples
        run: python -m compileall examples scripts
      - name: Test approval gate
        run: python -m unittest discover -s examples -p '*_test.py'
      - name: Check public content
        run: python scripts/check_public_content.py
